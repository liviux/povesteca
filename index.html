    <script>
      try { var p = JSON.parse(localStorage.getItem('povesteca:v1')) || {}; if (p.theme) document.documentElement.dataset.theme = p.theme; if (p.lang) document.documentElement.lang = p.lang; } catch (e) {}
      // Dark mode: the device asks for it, or Dark Reader runs (it marks the page with <meta name="darkreader">).
      // Then the page uses its own dark colours and adds <meta name="darkreader-lock">, Dark Reader's documented
      // signal for a site with its own dark theme, so the extension stops recolouring it.
      (function () {
        var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)'), reader = false;
        function apply() {
          reader = reader || !!document.querySelector('meta[name="darkreader"]');
          var dark = mq.matches || reader;
          root.toggleAttribute('data-dark', dark);
          if (dark && !document.querySelector('meta[name="darkreader-lock"]')) {
            var m = document.createElement('meta'); m.name = 'darkreader-lock'; document.head.appendChild(m);
          }
        }
        apply();
        mq.addEventListener('change', apply);
        new MutationObserver(apply).observe(document.head, { childList: true });
      })();
      // Explore needs the credits and summaries for its filters and search as soon as it opens; the
      // other pages start their details after the first render, so the text can appear sooner.
      (function () {
        var u = window.__CATALOG_URLS__;
        if (!u || !/^\/explorare(\/|$)/.test(location.pathname)) return;
        var lang = 'ro';
        try { var saved = JSON.parse(localStorage.getItem('povesteca:v1')) || {}; if (saved.lang === 'en') lang = 'en'; } catch (e) {}
        [u.common, u.browse, u[lang]].forEach(function (href) {
          document.head.append(Object.assign(document.createElement('link'), { rel: 'preload', as: 'fetch', crossorigin: '', href: href }));
        });
      })();
    </script>
  </head>

  </body>
